<VirtualHost *:80>
    ServerName api.buicojourney.com

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ProxyPass        / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog  "logs/api.buicojourney.com-error.log"
    CustomLog "logs/api.buicojourney.com-access.log" combined
</VirtualHost>

# Enable this only after:
# 1. port 443 from the public internet reaches this machine
# 2. you have a valid TLS certificate for api.buicojourney.com
#
# <VirtualHost *:443>
#     ServerName api.buicojourney.com
#
#     SSLEngine on
#     SSLCertificateFile "C:/path/to/fullchain.pem"
#     SSLCertificateKeyFile "C:/path/to/privkey.pem"
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#
#     RequestHeader set X-Forwarded-Proto "https"
#     RequestHeader set X-Forwarded-Port "443"
#
#     ProxyPass        / http://127.0.0.1:3001/
#     ProxyPassReverse / http://127.0.0.1:3001/
#
#     ErrorLog  "logs/api.buicojourney.com-ssl-error.log"
#     CustomLog "logs/api.buicojourney.com-ssl-access.log" combined
# </VirtualHost>
