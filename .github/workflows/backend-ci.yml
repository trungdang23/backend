name: backend-ci

on:
  pull_request:
  push:

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey
          POSTGRES_DB: journey_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://journey:journey@localhost:5432/journey_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: bash ./scripts/check-secrets.sh

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm prisma:validate
