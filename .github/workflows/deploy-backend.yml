name: deploy-backend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey
          POSTGRES_DB: journey_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://journey:journey@localhost:5432/journey_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: bash ./scripts/check-secrets.sh

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm prisma:validate

  deploy-backend:
    needs: verify-backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate deploy secrets and variables
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          RUNTIME_JWT_ACCESS_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_ACCESS_TOKEN_SECRET }}
          RUNTIME_JWT_REFRESH_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_REFRESH_TOKEN_SECRET }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_GLOBAL_PREFIX: ${{ vars.RUNTIME_GLOBAL_PREFIX }}
          RUNTIME_SWAGGER_ENABLED: ${{ vars.RUNTIME_SWAGGER_ENABLED }}
          RUNTIME_JWT_ISSUER: ${{ vars.RUNTIME_JWT_ISSUER }}
          RUNTIME_JWT_ACCESS_TOKEN_TTL: ${{ vars.RUNTIME_JWT_ACCESS_TOKEN_TTL }}
          RUNTIME_JWT_REFRESH_TOKEN_TTL: ${{ vars.RUNTIME_JWT_REFRESH_TOKEN_TTL }}
        run: |
          test -n "${CLOUDFLARE_ACCESS_CLIENT_ID}"
          test -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${RUNTIME_DATABASE_URL}"
          test -n "${RUNTIME_JWT_ACCESS_TOKEN_SECRET}"
          test -n "${RUNTIME_JWT_REFRESH_TOKEN_SECRET}"
          test -n "${DEPLOY_PATH}"
          test -n "${RUNTIME_ENV_PATH}"
          test -n "${SERVICE_RESTART_COMMAND}"
          test -n "${RUNTIME_APP_NAME}"
          test -n "${RUNTIME_APP_PORT}"
          test -n "${RUNTIME_GLOBAL_PREFIX}"
          test -n "${RUNTIME_SWAGGER_ENABLED}"
          test -n "${RUNTIME_JWT_ISSUER}"
          test -n "${RUNTIME_JWT_ACCESS_TOKEN_TTL}"
          test -n "${RUNTIME_JWT_REFRESH_TOKEN_TTL}"
          case "${RUNTIME_ENV_PATH}" in
            */.env|*/.env.*) ;;
            *)
              echo "RUNTIME_ENV_PATH must point to a file such as /path/to/.env.production." >&2
              exit 1
              ;;
          esac
          if [ -z "${SSH_PORT}" ]; then
            echo "SSH_PORT is not set. Falling back to port 22."
          fi

      - name: Install cloudflared client
        env:
          CLOUDFLARED_VERSION: 2026.3.0
        run: |
          install -m 755 -d "${HOME}/bin"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o "${HOME}/bin/cloudflared"
          chmod 755 "${HOME}/bin/cloudflared"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/cloudflared" --version

      - name: Configure SSH
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          private_key_source="$(mktemp)"
          decoded_key="$(mktemp)"
          printf '%s' "${SSH_PRIVATE_KEY}" > "${private_key_source}"
          perl -0pi -e 's/^\s*```(?:\w+)?\r?\n//; s/\r?\n```\s*$//; s/\A"(.*)"\z/$1/s; s/\A\x27(.*)\x27\z/$1/s; s/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g; s/[ \t]+$//mg' "${private_key_source}"
          if ssh-keygen -y -f "${private_key_source}" >/dev/null 2>&1; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif grep -q 'BEGIN '"OPENSSH"' PRIVATE KEY' "${private_key_source}"; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif tr -d '\r\n\t ' < "${private_key_source}" | base64 --decode --ignore-garbage > "${decoded_key}" 2>/dev/null \
            && ssh-keygen -y -f "${decoded_key}" >/dev/null 2>&1; then
            cp "${decoded_key}" ~/.ssh/id_ed25519
          else
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a valid base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          printf '%s' "${SSH_KNOWN_HOSTS}" \
            | perl -0pe 's/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g' \
            > ~/.ssh/known_hosts
          ssh_port="${SSH_PORT:-22}"
          cat > ~/.ssh/config <<EOF
          Host ${SSH_HOST}
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${ssh_port}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ProxyCommand ${HOME}/bin/cloudflared access ssh --hostname %h --service-token-id ${TUNNEL_SERVICE_TOKEN_ID} --service-token-secret ${TUNNEL_SERVICE_TOKEN_SECRET}
          EOF
          chmod 600 ~/.ssh/config
          rm -f "${private_key_source}" "${decoded_key}"

      - name: Render runtime env file from GitHub configuration
        env:
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          RUNTIME_JWT_ACCESS_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_ACCESS_TOKEN_SECRET }}
          RUNTIME_JWT_REFRESH_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_REFRESH_TOKEN_SECRET }}
          RUNTIME_SWAGGER_USERNAME: ${{ secrets.RUNTIME_SWAGGER_USERNAME }}
          RUNTIME_SWAGGER_PASSWORD: ${{ secrets.RUNTIME_SWAGGER_PASSWORD }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_GLOBAL_PREFIX: ${{ vars.RUNTIME_GLOBAL_PREFIX }}
          RUNTIME_SWAGGER_ENABLED: ${{ vars.RUNTIME_SWAGGER_ENABLED }}
          RUNTIME_CORS_ALLOWED_ORIGINS: ${{ vars.RUNTIME_CORS_ALLOWED_ORIGINS }}
          RUNTIME_JWT_ISSUER: ${{ vars.RUNTIME_JWT_ISSUER }}
          RUNTIME_JWT_ACCESS_TOKEN_TTL: ${{ vars.RUNTIME_JWT_ACCESS_TOKEN_TTL }}
          RUNTIME_JWT_REFRESH_TOKEN_TTL: ${{ vars.RUNTIME_JWT_REFRESH_TOKEN_TTL }}
          RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS }}
          RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS }}
        run: |
          {
            printf 'NODE_ENV=production\n'
            printf 'APP_NAME=%s\n' "${RUNTIME_APP_NAME}"
            printf 'APP_PORT=%s\n' "${RUNTIME_APP_PORT}"
            printf 'GLOBAL_PREFIX=%s\n' "${RUNTIME_GLOBAL_PREFIX}"
            printf 'SWAGGER_ENABLED=%s\n' "${RUNTIME_SWAGGER_ENABLED}"
            printf 'SWAGGER_USERNAME=%s\n' "${RUNTIME_SWAGGER_USERNAME}"
            printf 'SWAGGER_PASSWORD=%s\n' "${RUNTIME_SWAGGER_PASSWORD}"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "${RUNTIME_CORS_ALLOWED_ORIGINS}"
            printf 'DATABASE_URL=%s\n' "${RUNTIME_DATABASE_URL}"
            printf 'JWT_ISSUER=%s\n' "${RUNTIME_JWT_ISSUER}"
            printf 'JWT_ACCESS_TOKEN_TTL=%s\n' "${RUNTIME_JWT_ACCESS_TOKEN_TTL}"
            printf 'JWT_REFRESH_TOKEN_TTL=%s\n' "${RUNTIME_JWT_REFRESH_TOKEN_TTL}"
            printf 'JWT_ACCESS_TOKEN_SECRET=%s\n' "${RUNTIME_JWT_ACCESS_TOKEN_SECRET}"
            printf 'JWT_REFRESH_TOKEN_SECRET=%s\n' "${RUNTIME_JWT_REFRESH_TOKEN_SECRET}"
            printf 'AUTH_RATE_LIMIT_MAX_REQUESTS=%s\n' "${RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS}"
            printf 'AUTH_RATE_LIMIT_WINDOW_SECONDS=%s\n' "${RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS}"
          } > .deploy-runtime.env
          chmod 600 .deploy-runtime.env

      - name: Preflight SSH diagnostics
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          echo "Known hosts fingerprints:"
          ssh-keygen -lf ~/.ssh/known_hosts || true
          echo "cloudflared version:"
          "${HOME}/bin/cloudflared" --version
          echo "Token id sha256:"
          printf '%s' "${TUNNEL_SERVICE_TOKEN_ID}" | sha256sum | cut -d' ' -f1
          echo "Token secret sha256:"
          printf '%s' "${TUNNEL_SERVICE_TOKEN_SECRET}" | sha256sum | cut -d' ' -f1
          debug_log="$(mktemp)"
          set +e
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=20 "${SSH_HOST}" "true" > /dev/null 2> "${debug_log}"
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "SSH preflight failed with exit code ${status}."
            sed -E 's/(--service-token-id) [^ ]+/\1 ***/g; s/(--service-token-secret) [^ ]+/\1 ***/g' "${debug_log}" | tail -n 200
            exit "${status}"
          fi
          rm -f "${debug_log}"

      - name: Upload runtime env file
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
        run: |
          runtime_env_dir="$(dirname "${RUNTIME_ENV_PATH}")"
          runtime_env_tmp="${RUNTIME_ENV_PATH}.tmp"
          ssh "${SSH_HOST}" "install -m 700 -d '${runtime_env_dir}' && if [ -d '${RUNTIME_ENV_PATH}' ]; then echo 'RUNTIME_ENV_PATH points to a directory, expected a file path.' >&2; exit 1; fi"
          scp .deploy-runtime.env "${SSH_HOST}:${runtime_env_tmp}"
          ssh "${SSH_HOST}" "mv '${runtime_env_tmp}' '${RUNTIME_ENV_PATH}' && chmod 600 '${RUNTIME_ENV_PATH}'"

      - name: Deploy on target machine
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          ssh "${SSH_HOST}" \
            "set -euo pipefail && \
            export NVM_DIR=\"\$HOME/.nvm\" && \
            test -s \"\$NVM_DIR/nvm.sh\" && \
            . \"\$NVM_DIR/nvm.sh\" && \
            (nvm use 20.20.2 >/dev/null || nvm use default >/dev/null) && \
            cd '${DEPLOY_PATH}' && \
            git fetch --all --prune && \
            git checkout '${DEPLOY_REF}' && \
            git pull origin '${DEPLOY_REF}' && \
            pnpm install --frozen-lockfile && \
            pnpm prisma:generate && \
            pnpm build && \
            set -a && \
            . '${RUNTIME_ENV_PATH}' && \
            set +a && \
            pnpm prisma:migrate:deploy && \
            ${SERVICE_RESTART_COMMAND}"
