name: deploy-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: backend-production
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: journey
          POSTGRES_DB: journey_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://journey:journey@localhost:5432/journey_ci?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan tracked files for secrets
        run: bash ./scripts/check-secrets.sh

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Prisma schema
        run: pnpm prisma:validate

  deploy-backend:
    needs: verify-backend
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Validate deploy configuration
        env:
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          RUNTIME_JWT_ACCESS_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_ACCESS_TOKEN_SECRET }}
          RUNTIME_JWT_REFRESH_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_REFRESH_TOKEN_SECRET }}
          RUNTIME_JOURNAL_ASSET_SIGNING_SECRET: ${{ secrets.RUNTIME_JOURNAL_ASSET_SIGNING_SECRET }}
          RUNTIME_SWAGGER_USERNAME: ${{ secrets.RUNTIME_SWAGGER_USERNAME }}
          RUNTIME_SWAGGER_PASSWORD: ${{ secrets.RUNTIME_SWAGGER_PASSWORD }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_GLOBAL_PREFIX: ${{ vars.RUNTIME_GLOBAL_PREFIX }}
          RUNTIME_SWAGGER_ENABLED: ${{ vars.RUNTIME_SWAGGER_ENABLED }}
          RUNTIME_CORS_ALLOWED_ORIGINS: ${{ vars.RUNTIME_CORS_ALLOWED_ORIGINS }}
          RUNTIME_JWT_ISSUER: ${{ vars.RUNTIME_JWT_ISSUER }}
          RUNTIME_JWT_ACCESS_TOKEN_TTL: ${{ vars.RUNTIME_JWT_ACCESS_TOKEN_TTL }}
          RUNTIME_JWT_REFRESH_TOKEN_TTL: ${{ vars.RUNTIME_JWT_REFRESH_TOKEN_TTL }}
          RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS }}
          RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS }}
          RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS: ${{ vars.RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS }}
        run: |
          test -n "${RUNTIME_DATABASE_URL}"
          test -n "${RUNTIME_JWT_ACCESS_TOKEN_SECRET}"
          test -n "${RUNTIME_JWT_REFRESH_TOKEN_SECRET}"
          test -n "${RUNTIME_JOURNAL_ASSET_SIGNING_SECRET}"
          test -n "${DEPLOY_PATH}"
          test -n "${RUNTIME_ENV_PATH}"
          test -n "${SERVICE_RESTART_COMMAND}"
          test -n "${RUNTIME_APP_NAME}"
          test -n "${RUNTIME_APP_PORT}"
          test -n "${RUNTIME_GLOBAL_PREFIX}"
          test -n "${RUNTIME_SWAGGER_ENABLED}"
          test -n "${RUNTIME_CORS_ALLOWED_ORIGINS}"
          test -n "${RUNTIME_JWT_ISSUER}"
          test -n "${RUNTIME_JWT_ACCESS_TOKEN_TTL}"
          test -n "${RUNTIME_JWT_REFRESH_TOKEN_TTL}"
          test -n "${RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS}"
          test -n "${RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS}"
          test -n "${RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS}"
          case "${RUNTIME_DATABASE_URL}" in
            postgresql://*|postgres://*) ;;
            *)
              echo "RUNTIME_DATABASE_URL must start with postgresql:// or postgres://." >&2
              exit 1
              ;;
          esac
          if [ "${RUNTIME_SWAGGER_ENABLED}" = "true" ]; then
            test -n "${RUNTIME_SWAGGER_USERNAME}"
            test -n "${RUNTIME_SWAGGER_PASSWORD}"
          fi
          case "${RUNTIME_ENV_PATH}" in
            */.env|*/.env.*) ;;
            *)
              echo "RUNTIME_ENV_PATH must point to a file such as /path/to/.env.production." >&2
              exit 1
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Sync repository to deploy path
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync is required on the self-hosted runner." >&2
            exit 1
          fi
          install -m 755 -d "$(dirname "${DEPLOY_PATH}")"
          install -m 755 -d "${DEPLOY_PATH}"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env.production' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_PATH}/"

      - name: Render runtime env file from GitHub configuration
        env:
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          RUNTIME_JWT_ACCESS_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_ACCESS_TOKEN_SECRET }}
          RUNTIME_JWT_REFRESH_TOKEN_SECRET: ${{ secrets.RUNTIME_JWT_REFRESH_TOKEN_SECRET }}
          RUNTIME_JOURNAL_ASSET_SIGNING_SECRET: ${{ secrets.RUNTIME_JOURNAL_ASSET_SIGNING_SECRET }}
          RUNTIME_SWAGGER_USERNAME: ${{ secrets.RUNTIME_SWAGGER_USERNAME }}
          RUNTIME_SWAGGER_PASSWORD: ${{ secrets.RUNTIME_SWAGGER_PASSWORD }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_GLOBAL_PREFIX: ${{ vars.RUNTIME_GLOBAL_PREFIX }}
          RUNTIME_SWAGGER_ENABLED: ${{ vars.RUNTIME_SWAGGER_ENABLED }}
          RUNTIME_CORS_ALLOWED_ORIGINS: ${{ vars.RUNTIME_CORS_ALLOWED_ORIGINS }}
          RUNTIME_JWT_ISSUER: ${{ vars.RUNTIME_JWT_ISSUER }}
          RUNTIME_JWT_ACCESS_TOKEN_TTL: ${{ vars.RUNTIME_JWT_ACCESS_TOKEN_TTL }}
          RUNTIME_JWT_REFRESH_TOKEN_TTL: ${{ vars.RUNTIME_JWT_REFRESH_TOKEN_TTL }}
          RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS }}
          RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS }}
          RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS: ${{ vars.RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS }}
        run: |
          {
            printf 'NODE_ENV=production\n'
            printf 'APP_NAME=%s\n' "${RUNTIME_APP_NAME}"
            printf 'APP_PORT=%s\n' "${RUNTIME_APP_PORT}"
            printf 'GLOBAL_PREFIX=%s\n' "${RUNTIME_GLOBAL_PREFIX}"
            printf 'SWAGGER_ENABLED=%s\n' "${RUNTIME_SWAGGER_ENABLED}"
            printf 'SWAGGER_USERNAME=%s\n' "${RUNTIME_SWAGGER_USERNAME}"
            printf 'SWAGGER_PASSWORD=%s\n' "${RUNTIME_SWAGGER_PASSWORD}"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "${RUNTIME_CORS_ALLOWED_ORIGINS}"
            printf 'DATABASE_URL=%s\n' "${RUNTIME_DATABASE_URL}"
            printf 'JWT_ISSUER=%s\n' "${RUNTIME_JWT_ISSUER}"
            printf 'JWT_ACCESS_TOKEN_TTL=%s\n' "${RUNTIME_JWT_ACCESS_TOKEN_TTL}"
            printf 'JWT_REFRESH_TOKEN_TTL=%s\n' "${RUNTIME_JWT_REFRESH_TOKEN_TTL}"
            printf 'JWT_ACCESS_TOKEN_SECRET=%s\n' "${RUNTIME_JWT_ACCESS_TOKEN_SECRET}"
            printf 'JWT_REFRESH_TOKEN_SECRET=%s\n' "${RUNTIME_JWT_REFRESH_TOKEN_SECRET}"
            printf 'AUTH_RATE_LIMIT_MAX_REQUESTS=%s\n' "${RUNTIME_AUTH_RATE_LIMIT_MAX_REQUESTS}"
            printf 'AUTH_RATE_LIMIT_WINDOW_SECONDS=%s\n' "${RUNTIME_AUTH_RATE_LIMIT_WINDOW_SECONDS}"
            printf 'JOURNAL_ASSET_SIGNING_SECRET=%s\n' "${RUNTIME_JOURNAL_ASSET_SIGNING_SECRET}"
            printf 'JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS=%s\n' "${RUNTIME_JOURNAL_ASSET_SIGNED_URL_TTL_SECONDS}"
          } > .deploy-runtime.env
          chmod 600 .deploy-runtime.env

      - name: Write runtime env file on deploy machine
        env:
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
        run: |
          runtime_env_dir="$(dirname "${RUNTIME_ENV_PATH}")"
          install -m 700 -d "${runtime_env_dir}"
          if [ -d "${RUNTIME_ENV_PATH}" ]; then
            echo "RUNTIME_ENV_PATH points to a directory, expected a file path." >&2
            exit 1
          fi
          install -m 600 .deploy-runtime.env "${RUNTIME_ENV_PATH}"

      - name: Deploy on target machine
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
        run: |
          service_restart_command="$(printf '%s' "${SERVICE_RESTART_COMMAND}" | perl -0pe 's/\r//g; s/^\s+//; s/\s+\z//')"
          if [ -z "${service_restart_command}" ]; then
            echo "SERVICE_RESTART_COMMAND is empty after sanitization." >&2
            exit 1
          fi
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          bash ./scripts/ensure-runtime-database.sh
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm build
          set -a
          . "${RUNTIME_ENV_PATH}"
          set +a
          pnpm prisma:migrate:deploy
          ${service_restart_command}
