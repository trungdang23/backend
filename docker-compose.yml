name: backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: journey-backend-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journey}
      POSTGRES_DB: ${POSTGRES_DB:-journey}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - journey-backend-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-journey} -d ${POSTGRES_DB:-journey}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  journey-backend-postgres-data:
